services:
  mongo:
    image: mongo:7
    container_name: pharmaguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pharmaguard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ml-service:
    build: ./ml-service
    container_name: pharmaguard-ml-service
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  server:
    build: ./server
    container_name: pharmaguard-server
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/pharmaguard
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=change-me-in-production
      - PORT=5000
    ports:
      - "5001:5000"
    depends_on:
      - mongo
      - ml-service

  client:
    build: ./client
    container_name: pharmaguard-client
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5001/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
  qdrant_data:
